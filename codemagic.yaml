workflows:
  ginulis-ios-unsigned:
    name: Ginulis.id - iOS IPA untuk Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      flutter: 3.47.7
      xcode: latest
      cocoapods: default
      groups:
        - ginulis_config
    scripts:
      - name: Siapkan proyek iOS
        script: |
          if [ ! -f "ios/Runner.xcodeproj/project.pbxproj" ]; then
            flutter create . --platforms=ios
          fi
      - name: Unduh dependensi Flutter
        script: flutter pub get
      - name: Siapkan CocoaPods
        script: |
          if [ -f "ios/Podfile" ]; then
            cd ios && pod install
          fi
      - name: Build iOS tanpa code signing
        script: |
          test -n "$SUPABASE_URL" || { echo 'SUPABASE_URL belum diatur'; exit 1; }
          test -n "$SUPABASE_ANON_KEY" || { echo 'SUPABASE_ANON_KEY belum diatur'; exit 1; }
          flutter build ios --release --no-codesign \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
      - name: Kemas aplikasi sebagai IPA unsigned
        script: |
          test -d build/ios/iphoneos/Runner.app || { echo 'Runner.app tidak ditemukan'; exit 1; }
          mkdir -p build/ios/ipa build/ios/unsigned_payload/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/unsigned_payload/Payload/
          (cd build/ios/unsigned_payload && zip -qry ../ipa/Ginulis-unsigned.ipa Payload)
          ls -lh build/ios/ipa/Ginulis-unsigned.ipa
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
